<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- เปลี่ยน Title ตรงนี้เพื่อไม่ให้สปอยล์บนแท็บเบราว์เซอร์ -->
    <title>แบบสำรวจความคิดเห็น (โครงงานกลุ่ม)</title>

    <!-- ส่วนนี้คือการหลอกพรีวิวของ LINE / Messenger / Facebook ให้ดูเป็นงานวิจัย -->
    <meta property="og:title" content="📊 แบบสอบถามเพื่อการศึกษา (โครงงานกลุ่ม)">
    <meta property="og:description" content="รบกวนเวลา 2 นาทีทำแบบสอบถามให้หน่อยครับ ของสาขาเทคโนโลยีธุรกิจดิจิทัลและสื่อมัลติมีเดีย มทร.รัตนโกสินทร์">
    <meta property="og:type" content="website">
    
    <!-- หลอกพรีวิวของ Twitter/X -->
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="📊 แบบสอบถามเพื่อการศึกษา (โครงงานกลุ่ม)">
    <meta name="twitter:description" content="รบกวนเวลา 2 นาทีทำแบบสอบถามให้หน่อยครับ ของสาขาเทคโนโลยีธุรกิจดิจิทัลและสื่อมัลติมีเดีย มทร.รัตนโกสินทร์">

    <style>
        body {
            background-color: #ffe6e6;
            font-family: 'sans-serif';
            text-align: center;
            padding: 20px;
            color: #ff4d4d;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            max-width: 90%;
            width: 400px;
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 { font-size: 24px; margin-bottom: 10px; }
        p { font-size: 16px; color: #555; line-height: 1.6; }
        .highlight { color: #ff4d4d; font-weight: bold; }
        .btn-group { 
            margin-top: 30px; 
            display: flex;
            flex-wrap: wrap; 
            align-items: center;
            justify-content: center;
            gap: 15px;
            width: 100%;
        }
        button {
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s ease; 
        }
        .btn-yes {
            background-color: #ff4d4d;
            color: white;
            box-shadow: 0 4px 6px rgba(255, 77, 77, 0.3);
            font-size: 16px; 
            padding: 0.75em 1.5em; 
            white-space: nowrap; 
        }
        .btn-yes:hover { background-color: #e60000; transform: scale(1.05); }
        .btn-no {
            background-color: #ccc;
            color: #333;
            font-size: 16px;
            padding: 12px 25px;
        }
    </style>
</head>
<body>
    <div class="container" id="mainBox">
        <h1>เธอครับ... เค้าขอโทษ 🥺</h1>
        <p>ที่บอกเลิกไปวันนั้น เค้าไม่ได้อยากเลิกจริงๆ นะ <br><span class="highlight">เค้าแค่น้อยใจ</span> อารมณ์ชั่ววูบแท้ๆ เลย</p>
        <p>เราคบกันมาตั้ง 1 ปี 6 เดือนแล้วนะ ถึงระยะทางมันจะทำให้เราอยู่ไกลกัน แต่ใจเค้าไม่เคยอยากห่างเธอเลย เค้าอยู่ไม่ได้จริงๆ ถ้าไม่มีเธอ...</p>
        <h3>ดีกันนะ ให้อภัยเค้าได้มั้ย?</h3>
        <div class="btn-group">
            <button class="btn-yes" id="btnYes" onclick="forgiveMe()">ให้อภัย</button>
            <button class="btn-no" id="btnNo" onclick="handleNoClick()">ไม่ให้อภัย</button>
        </div>
    </div>

    <script>
        let noClickCount = 0;
        let currentFontSize = 16;
        const noTexts = [
            "ไม่ให้อภัย",
            "คิดดีๆ นะ",
            "แน่ใจอ่อ?",
            "อย่าใจร้ายดิ 🥺",
            "ให้โอกาสเค้าหน่อยยย",
            "ขอร้องล่ะ",
            "ดีกันเถอะนะๆๆ",
            "จะร้องไห้แล้วนะ 😭",
            "ใจแข็งไปป่าววว",
            "กดให้อภัยเถอะ กราบล่ะ 🙏"
        ];

        function handleNoClick() {
            noClickCount++;
            let btnNo = document.getElementById('btnNo');
            let btnYes = document.getElementById('btnYes');

            if (noClickCount < noTexts.length) {
                btnNo.innerText = noTexts[noClickCount];
            } else {
                btnNo.innerText = "ยอมแล้ววว ให้อภัยเถอะ!";
            }

            currentFontSize += 15; 
            btnYes.style.fontSize = currentFontSize + 'px';
        }

        function forgiveMe() {
            document.getElementById('mainBox').innerHTML = '<h1>เย้! ขอบคุณนะคร้าบบ 🎉</h1><p>รักเธอที่สุดในโลกเลย รอรับสายเค้าด้วยนะ!</p>';
        }
    </script>
</body>
</html>
